<style>
  .cp { position: absolute; left: 64px; top: 300px; transform-origin: 0 50%; }
  .cp-pill { gap: 0; padding: 10px 30px 10px 10px; font-size: 26px; letter-spacing: 0.16em;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28), 0 2px 6px rgba(0, 0, 0, 0.18); }
  .cp-pill .num { width: 50px; height: 50px; font-size: 23px; margin-right: 18px; font-variant-numeric: tabular-nums; }
  .cp-label { position: relative; display: inline-block; line-height: 50px; }
  .cp-label .strike { top: 50%; height: 4px; margin-top: -2px; left: -6px; right: 0; }
  .cp-done { display: inline-flex; overflow: hidden; width: 0; }
  .cp-chip { display: inline-flex; align-items: center; gap: 8px; margin-left: 18px; height: 50px; padding: 0 20px 0 16px;
    border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 21px; letter-spacing: 0.14em;
    white-space: nowrap; line-height: 1; }
  .cp-chip svg { flex: none; }
</style>
<div class="cp" id="cp">
  <div class="pill cp-pill" id="pill">
    <span class="num" id="num"></span>
    <span class="cp-label" id="label"><span id="text"></span></span>
    <span class="cp-done" id="done"><span class="cp-chip" id="chip"></span></span>
  </div>
</div>
<script>
  (() => {
    const P = GFX.params, D = GFX.duration;
    const cp = GFX.$("#cp"), pill = GFX.$("#pill"), num = GFX.$("#num"), label = GFX.$("#label"), text = GFX.$("#text");
    const done = GFX.$("#done"), chip = GFX.$("#chip");
    text.textContent = P.label || "";
    const n = String(P.number ?? "").trim();
    if (n) num.textContent = n; else { num.remove(); pill.style.paddingLeft = "30px"; }
    const doneText = String(P.done_text || "").replace(/^\s*[×x✕✗]\s+/i, "").trim();

    // entrance: slide in from the left, number pops, label wipes on; then everything holds still
    GFX.anim(pill, [{ opacity: 0, transform: "translateX(-70px)" }, { opacity: 1, transform: "translateX(0)" }], { at: 60, dur: 460, ease: "back" });
    if (n) GFX.anim(num, [{ transform: "scale(0) rotate(-120deg)" }, { transform: "scale(1) rotate(0deg)" }], { at: 200, dur: 420, ease: "back" });
    GFX.anim(label, [{ clipPath: "inset(-10px 100% -10px 0)" }, { clipPath: "inset(-10px 0% -10px 0)" }], { at: 260, dur: 420, ease: "out", fill: "backwards" });

    // keep the whole pill (with its chip) inside the frame's left safe column
    GFX.layout(() => {
      const full = pill.scrollWidth + (doneText ? chip.scrollWidth + 18 : 0);
      if (full > 900) cp.style.transform = `scale(${900 / full})`;
    });

    if (doneText) {
      chip.innerHTML = GFX.icon("x", { size: 20, stroke: "currentColor", width: 3.4 }) + GFX.esc(doneText);
      const strike = GFX.h("i", { class: "strike" });
      label.append(strike);
      const frac = Math.min(1, Math.max(0, Number(P.done_at ?? 0.75)));
      const tDone = Math.max(760, Math.min(D * frac, D - 720));
      GFX.anim(strike, [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { at: tDone, dur: 320, ease: "inOut" });
      GFX.anim(text, [{ opacity: 1 }, { opacity: 0.45 }], { at: tDone + 120, dur: 300, ease: "out" });
      GFX.layout(() => {
        const w = chip.offsetWidth + 18;
        GFX.anim(done, [{ width: "0px" }, { width: w + "px" }], { at: tDone + 220, dur: 420, ease: "expo" });
        // the chip sits in the pill's end cap like the number does at the start
        GFX.anim(pill, [{ paddingRight: "30px" }, { paddingRight: "10px" }], { at: tDone + 220, dur: 420, ease: "expo" });
      });
      GFX.anim(chip, [{ opacity: 0, transform: "scale(.4)" }, { opacity: 1, transform: "scale(1)" }], { at: tDone + 260, dur: 380, ease: "back" });
      GFX.anim(pill, [{ transform: "translateX(0)" }, { transform: "translateX(-8px)" }, { transform: "translateX(5px)" },
        { transform: "translateX(0)" }], { at: tDone + 260, dur: 260, ease: "out", fill: "none" });
    } else done.remove();
  })();
</script>

<style>
  /* window 920x808 at (80, 280); inside it: bar 58, viewer 452, controls 56, timeline 242 */
  .et-win { position: absolute; left: 80px; top: 280px; width: 920px; height: 808px; }
  .et-win .bar { font-size: 21px; color: #9A9A95; }
  .et-win .bar b { flex: 1; min-width: 0; white-space: nowrap; }
  .et-spec { font-family: var(--mono); font-size: 20px; color: #6E6E6A; white-space: nowrap; }
  .et-viewer { position: relative; height: 452px; background: #0D0D0D; }
  .et-tag { position: absolute; left: 26px; top: 20px; font-family: var(--mono); font-weight: 700; font-size: 20px;
    letter-spacing: .2em; text-transform: uppercase; color: #6E6E6A; }
  .et-fit { position: absolute; right: 26px; top: 20px; display: flex; gap: 10px; }
  .et-fit span { font-family: var(--mono); font-weight: 700; font-size: 20px; letter-spacing: .12em; color: #6E6E6A;
    padding: 4px 10px; border-radius: 6px; background: #1C1C1B; }
  .et-live { position: absolute; left: 26px; top: 56px; display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-weight: 700; font-size: 20px; letter-spacing: .14em; color: #BDBDB8; }
  .et-live i { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  .et-mon { position: absolute; left: 342px; top: 18px; width: 236px; height: 418px; border-radius: 12px; overflow: hidden;
    background: linear-gradient(170deg, #3A3A37, #1B1B1A); box-shadow: 0 0 0 2px #2B2B29; }
  .et-mon .et-ghost { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #5C5C58; }
  .et-mon .speaker { left: 0; top: 0; width: 100%; height: 100%; }
  .et-safe { position: absolute; inset: 22px 16px; border: 1.5px dashed rgba(255, 255, 255, .22); border-radius: 6px; }
  .et-meters { position: absolute; left: 598px; top: 138px; height: 298px; display: flex; gap: 6px; }
  .et-meters i { position: relative; width: 10px; height: 100%; border-radius: 3px; background: #222221; overflow: hidden; }
  .et-meters s { position: absolute; left: 0; right: 0; bottom: 0; height: 40%;
    background: linear-gradient(0deg, #3FB26E 0%, #3FB26E 62%, #E7C443 80%, var(--accent) 100%); background-size: 100% 298px;
    background-position: bottom; }
  .et-ctrl { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    border-top: 1px solid rgba(255, 255, 255, .06); border-bottom: 1px solid rgba(255, 255, 255, .06); }
  .et-tools, .et-zoom { display: flex; align-items: center; gap: 8px; width: 290px; }
  .et-zoom { justify-content: flex-end; color: #8A8A85; gap: 12px; }
  .et-tools span { width: 34px; height: 34px; border-radius: 8px; background: #252524; color: #8A8A85; display: flex;
    align-items: center; justify-content: center; }
  .et-tools span.on { background: var(--accent); color: #fff; }
  .et-zoom u { position: relative; width: 120px; height: 6px; border-radius: 3px; background: #2C2C2A; }
  .et-zoom u::after { content: ""; position: absolute; left: 60%; top: -6px; width: 18px; height: 18px; border-radius: 50%; background: #9A9A95; }
  .et-tc { font-family: var(--mono); font-weight: 700; font-size: 34px; color: #F4F4F0; letter-spacing: .02em;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .et-tl { position: relative; padding: 0 24px 12px; }
  .et-ruler { position: relative; height: 30px; margin-left: 64px; }
  .et-ruler svg { position: absolute; inset: 0; }
  .et-track { display: flex; align-items: center; height: 44px; margin-top: 6px; }
  .et-track b { width: 64px; font-family: var(--mono); font-weight: 700; font-size: 20px; color: #7C7C77; }
  .et-lane { position: relative; flex: 1; height: 44px; border-radius: 7px; background: #1C1C1B; overflow: hidden; }
  .et-lane svg { position: absolute; inset: 0; }
  .et-clip { position: absolute; top: 6px; bottom: 6px; border-radius: 6px; }
  .et-clip.hot { background: var(--accent); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .25); }
  .et-clip.v1 { top: 3px; bottom: 3px; background: repeating-linear-gradient(90deg, #56564F 0 44px, #4B4B45 44px 46px);
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, .12); }
  .et-lane.a1 { background: #173222; }
  .et-lane.a2 { background: #2E2419; }
  .et-ph { position: absolute; left: 88px; top: 0; bottom: 12px; width: 0; z-index: 3; }
  .et-ph::before { content: ""; position: absolute; left: -1.5px; top: 14px; bottom: 0; width: 3px; background: var(--accent); }
  .et-knob { position: absolute; left: -12px; top: 0; width: 24px; height: 26px; background: var(--accent);
    clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%); border-radius: 4px 4px 0 0; }
</style>
<div class="window dark et-win" id="win">
  <div class="bar"><i></i><i></i><i></i><b id="title"></b><span class="et-spec">9:16 · 30 fps</span></div>
  <div class="et-viewer">
    <div class="et-tag">Program</div>
    <div class="et-fit"><span>FIT</span><span>1/2</span></div>
    <div class="et-live" id="live"><i></i><span id="mode"></span></div>
    <div class="et-mon" id="mon">
      <div class="et-ghost" id="ghost"></div>
      <img class="speaker" id="me" alt="">
      <div class="et-safe"></div>
    </div>
    <div class="et-meters"><i><s id="mL"></s></i><i><s id="mR"></s></i></div>
  </div>
  <div class="et-ctrl">
    <div class="et-tools" id="tools"></div>
    <div class="et-tc" id="tc">00:00:00:00</div>
    <div class="et-zoom" id="zoom"></div>
  </div>
  <div class="et-tl" id="tl">
    <div class="et-ruler" id="ruler"></div>
    <div class="et-track"><b>V2</b><div class="et-lane" id="v2"></div></div>
    <div class="et-track"><b>V1</b><div class="et-lane" id="v1"></div></div>
    <div class="et-track"><b>A1</b><div class="et-lane a1" id="a1"></div></div>
    <div class="et-track"><b>A2</b><div class="et-lane a2" id="a2"></div></div>
    <div class="et-ph" id="ph"><span class="et-knob"></span></div>
  </div>
</div>
<script>
  (() => {
    const P = GFX.params, D = GFX.duration;
    const EASE = { inOut: "cubic-bezier(.65,0,.35,1)", out: "cubic-bezier(.22,1,.36,1)", back: "cubic-bezier(.34,1.56,.64,1)", linear: "linear" };
    // one animation through absolute-time keyframes [{at, ease, ...css}]; ease shapes the segment that starts there
    const track = (el, frames) => {
      const t0 = frames[0].at, span = Math.max(1, frames[frames.length - 1].at - t0);
      return GFX.anim(el, frames.map(({ at, ease, ...css }) => ({ ...css, offset: (at - t0) / span, easing: EASE[ease] || EASE.inOut })),
        { at: t0, dur: span, ease: "linear" });
    };
    GFX.$("#title").textContent = P.title || "Timeline";
    GFX.$("#ghost").innerHTML = GFX.icon("user", { size: 110, width: 1.6 });
    GFX.speaker(GFX.$("#me"));

    // toolbar and zoom controls
    GFX.$("#tools").innerHTML = ["pointer", "scissors", "wand", "link", "image", "mic"]
      .map((n, i) => `<span class="${i === 0 ? "on" : ""}">${GFX.icon(n, { size: 18, width: 2.2, ...(n === "pointer" ? { fill: "#fff", stroke: "#fff", width: 1 } : {}) })}</span>`).join("");
    GFX.$("#zoom").innerHTML = GFX.icon("minus", { size: 20 }) + "<u></u>" + GFX.icon("plus", { size: 20 });

    // ruler ticks
    const LW = 808;
    let ticks = "";
    for (let x = 0, k = 0; x <= LW; x += 16, k++) ticks += `<line x1="${x}" x2="${x}" y1="${k % 5 ? 20 : 8}" y2="30" stroke="${k % 5 ? "#33332F" : "#5A5A55"}" stroke-width="2"/>`;
    GFX.$("#ruler").innerHTML = `<svg viewBox="0 0 ${LW} 30" width="${LW}" height="30">${ticks}</svg>`;

    // clips: accent overlays on V2, grey picture clips on V1 (fractions of the lane)
    const clips = (lane, cls, spans) => spans.forEach(([a, b]) =>
      GFX.$(lane).append(GFX.h("div", { class: "et-clip " + cls, style: `left:${a * 100}%;width:${(b - a) * 100}%` })));
    clips("#v2", "hot", [[0.07, 0.21], [0.46, 0.56], [0.73, 0.9]]);
    clips("#v1", "v1", [[0, 0.262], [0.268, 0.488], [0.494, 0.718], [0.724, 1]]);

    // waveforms: speech on A1 (bursts and gaps), a steady music bed on A2 — deterministic heights
    const wave = (lane, seed, color, speech) => {
      const r = GFX.rand(seed), bw = 3, gap = 2, H = 44;
      let bars = "";
      for (let x = 2, i = 0; x < LW - 2; x += bw + gap, i++) {
        const env = speech ? 0.35 + 0.65 * Math.abs(Math.sin(i * 0.23) * Math.sin(i * 0.071 + 1.3)) : 0.6 + 0.25 * Math.sin(i * 0.05) * Math.sin(i * 0.013 + 2);
        const h = Math.max(3, (speech ? 34 : 24) * env * (0.45 + 0.55 * r()));
        bars += `<rect x="${x}" y="${(H - h) / 2}" width="${bw}" height="${h}" rx="1.5"/>`;
      }
      GFX.$(lane).innerHTML = `<svg viewBox="0 0 ${LW} ${H}" width="${LW}" height="${H}" fill="${color}">${bars}</svg>`;
    };
    wave("#a1", 7, "#47C47E", true);
    wave("#a2", 19, "#8A6A3F", false);

    // playhead: the cursor grabs its knob and scrubs back and forth; the timecode follows the playhead
    const ph = GFX.$("#ph"), tc = GFX.$("#tc");
    const X0 = 80 + 88, KY = 280 + 58 + 452 + 56 + 12;   // lane origin and knob centre in frame coords
    const at = (p) => `translateX(${(p * LW).toFixed(1)}px)`;
    GFX.$("#mode").textContent = P.scrub ? "SCRUB" : "PLAY";
    if (P.scrub) {
      const stops = [[0, 0.6], [620, 0.62], [720, 0.62], [1180, 0.27], [1620, 0.81], [2060, 0.4], [2420, 0.57]]
        .map(([t, p]) => [Math.min(t * D / 2600, D - 60), p]);
      track(ph, stops.map(([t, p], i) => ({ at: t, transform: at(p), ease: i === 0 ? "linear" : "inOut" })));
      // pointer tip sits ~(11, 7) px inside the cursor box
      const pts = [{ x: 930, y: 1060, at: 320 }].concat(stops.slice(1).map(([t, p]) => ({ x: X0 + p * LW - 11, y: KY - 7, at: t })));
      const tEnd = stops[stops.length - 1][0];
      pts.push({ x: X0 + 0.57 * LW + 40, y: KY + 90, at: Math.min(D - 20, tEnd + 160) });
      const cur = GFX.cursor(pts);
      const icon = cur.firstElementChild;
      icon.style.transformOrigin = "20% 12%";
      const grab = stops[1][0];
      track(icon, [{ at: grab - 60, transform: "scale(1)", ease: "out" }, { at: grab + 60, transform: "scale(.84)" },
        { at: tEnd, transform: "scale(.84)", ease: "back" }, { at: Math.min(D - 10, tEnd + 150), transform: "scale(1)" }]);
    } else {
      track(ph, [{ at: 0, transform: at(0.38), ease: "linear" }, { at: D, transform: at(0.38 + D / 40000) }]);
    }
    // the timeline spans 40 s; the timecode reads the playhead (scrub) or runs in real time (play)
    const fmt = (s) => {
      const f = Math.floor((s % 1) * 30), S = Math.floor(s) % 60, M = Math.floor(s / 60) % 60, Hh = Math.floor(s / 3600);
      return [Hh, M, S, f].map((n) => String(n).padStart(2, "0")).join(":");
    };
    GFX.each(() => {
      const m = getComputedStyle(ph).transform.match(/matrix\(([^)]+)\)/);
      const px = m ? Number(m[1].split(",")[4]) : 0;
      tc.textContent = fmt(64 + (px / LW) * 40);
    }, 0, D);

    // audio meters bounce with the voice
    const mL = GFX.$("#mL"), mR = GFX.$("#mR"), rr = GFX.rand(5), lv = Array.from({ length: 400 }, () => rr());
    GFX.each((t) => {
      const i = Math.floor(t / (1000 / 15));
      const base = 0.42 + 0.3 * Math.abs(Math.sin(i * 0.37));
      mL.style.height = Math.round(100 * Math.min(0.96, base + 0.22 * lv[i % 400])) + "%";
      mR.style.height = Math.round(100 * Math.min(0.96, base - 0.04 + 0.22 * lv[(i + 97) % 400])) + "%";
    }, 0, D);
    GFX.anim(GFX.$("#live i"), [{ opacity: 1 }, { opacity: 0.25 }, { opacity: 1 }], { at: 0, dur: 900, iterations: Math.max(1, Math.floor(D / 900)), ease: "inOut" });

    GFX.in(GFX.$("#win"), "rise", { at: 0, dur: 520, ease: "back" });
    GFX.in(GFX.$$(".et-track"), "left", { at: 160, dur: 420, stagger: 60 });
    GFX.in(ph, "fade", { at: 360, dur: 240 });
  })();
</script>

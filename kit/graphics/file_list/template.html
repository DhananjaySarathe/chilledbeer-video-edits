<style>
  .fl-win { position: absolute; left: 72px; right: 72px; top: 320px; }
  .fl-win .bar { height: 68px; padding: 0 28px; }
  .fl-win .bar b { flex: 1; min-width: 0; font-family: var(--ui); font-weight: 700; font-size: 28px; color: var(--ink);
    white-space: nowrap; }
  .fl-count { font-family: var(--mono); font-weight: 500; font-size: 22px; letter-spacing: .06em; color: var(--muted);
    white-space: nowrap; font-variant-numeric: tabular-nums; }
  .fl-list { display: flex; flex-direction: column; gap: 4px; padding: 18px 24px; }
  .fl-row { position: relative; display: flex; align-items: center; gap: 22px; min-height: 92px; padding: 10px 20px; }
  .fl-hl { position: absolute; inset: 0; border-radius: 18px; background: var(--accent-soft); opacity: 0; }
  .fl-good .fl-hl { background: rgba(22, 163, 74, .13); }
  .fl-icon { position: relative; flex: none; width: 52px; height: 52px; border-radius: 12px; background: var(--ink);
    display: flex; align-items: center; justify-content: center; }
  .fl-name { position: relative; flex: 1; min-width: 0; font-family: var(--mono); font-weight: 500; font-size: 32px;
    line-height: 1.3; color: var(--ink); overflow-wrap: anywhere; }
  .fl-day { position: relative; flex: none; font-family: var(--mono); font-weight: 500; font-size: 22px; letter-spacing: .06em;
    color: var(--muted); }
  .fl-last .fl-name { font-weight: 700; }
  .fl-tag { position: absolute; right: 18px; bottom: -34px; z-index: 2; gap: 10px; padding: 12px 24px; font-size: 24px;
    background: var(--accent); color: var(--accent-ink); transform: rotate(-4deg); }
  .fl-good .fl-tag { background: var(--good); color: #fff; }
</style>
<div class="window fl-win" id="win">
  <div class="bar"><i></i><i></i><i></i><b id="title"></b><span class="fl-count" id="count"></span></div>
  <div class="fl-list" id="list"></div>
</div>
<script>
  (() => {
    const P = GFX.params, D = GFX.duration;
    const files = (P.files || []).slice(0, 6);
    const days = Array.isArray(P.days) ? P.days : ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    const good = P.final_tone === "good";
    GFX.$("#title").textContent = P.title || "exports";
    const list = GFX.$("#list"), count = GFX.$("#count"), win = GFX.$("#win");
    // room for every file plus the chip, centred in the content box (y 270-1090)
    const h = Math.max(470, 68 + 36 + files.length * 96 + 96);
    win.style.minHeight = h + "px";
    win.style.top = Math.round(680 - h / 2) + "px";

    const rows = files.map((name, i) => {
      const row = GFX.h("div", { class: "fl-row" },
        GFX.h("div", { class: "fl-hl" }),
        GFX.h("div", { class: "fl-icon", html: GFX.icon("play", { size: 24, fill: "#fff", stroke: "#fff", width: 1 }) }),
        GFX.h("div", { class: "fl-name", text: String(name) }),
        days.length ? GFX.h("div", { class: "fl-day", text: String(days[i % days.length]) }) : null);
      list.append(row);
      // names wrap instead of overflowing; the height limit keeps them on one line until they get too long
      GFX.fit(row.querySelector(".fl-name"), { width: 4000, height: 46, max: 32, min: 22 });
      return row;
    });

    // one size for every name: the smallest any row needed, but not below 26 px (an outlier wraps instead); runs after the fits
    GFX.layout(() => {
      const names = rows.map((row) => row.querySelector(".fl-name"));
      const size = Math.max(26, Math.min(...names.map((el) => parseFloat(el.style.fontSize) || 32)));
      names.forEach((el) => { el.style.fontSize = size + "px"; });
    });

    // files land one by one over the first ~60% of the scene, then the last one is flagged
    const n = rows.length, t0 = 320, tLast = n > 1 ? D * 0.58 : t0;
    const step = n > 1 ? (tLast - t0) / (n - 1) : 0;
    rows.forEach((row, i) => GFX.anim(row, [{ opacity: 0, transform: "translateY(26px)" }, { opacity: 1, transform: "translateY(0)" }],
      { at: t0 + i * step, dur: 380, ease: "out" }));
    GFX.each((t) => {
      const k = t < t0 ? 0 : Math.min(n, 1 + Math.floor((t - t0) / Math.max(1, step)));
      count.textContent = `${k} item${k === 1 ? "" : "s"}`;
    }, 0, tLast + 1);

    const last = rows[n - 1];
    if (last) {
      last.classList.add("fl-last");
      if (good) win.classList.add("fl-good");
      GFX.anim(last.querySelector(".fl-hl"), [{ opacity: 0 }, { opacity: 1 }], { at: tLast + 140, dur: 320 });
      const tagText = P.final_tag == null ? (good ? "Approved" : "Still not it") : P.final_tag;
      if (tagText) {
        const tag = GFX.h("div", { class: "chip fl-tag", html: GFX.icon(good ? "check" : "x", { size: 24, width: 3.4 }) + GFX.esc(tagText) });
        last.append(tag);
        GFX.anim(tag, [{ opacity: 0, transform: "scale(1.9) rotate(-12deg)" }, { opacity: 1, transform: "scale(1) rotate(-4deg)" }],
          { at: tLast + 320, dur: 380, ease: "snap" });
        GFX.anim(tag, [{ translate: "0 0" }, { translate: "-4px 0" }, { translate: "4px 0" }, { translate: "0 0" }],
          { at: tLast + 700, dur: 240, ease: "inOut" });
      }
    }
    GFX.in(win, "rise", { at: 0, dur: 480, ease: "back" });
  })();
</script>

<style>
  .fu-top { position: absolute; left: 64px; right: 64px; top: 330px; display: flex; flex-direction: column; align-items: center; }
  .fu-folder { position: relative; width: 280px; height: 214px; filter: drop-shadow(0 26px 34px rgba(17, 17, 17, .2)); }
  .fu-folder svg { position: absolute; inset: 0; overflow: visible; }
  .fu-arrow { position: absolute; left: 98px; top: 96px; width: 84px; height: 84px; color: var(--accent); }
  .fu-ring { position: absolute; left: -30px; top: -26px; right: -30px; bottom: -16px; border: 4px dashed var(--accent);
    border-radius: 46px; background: var(--accent-soft); opacity: 0; }
  .fu-label { margin-top: 34px; font-family: var(--mono); font-weight: 500; font-size: 26px; letter-spacing: .06em;
    color: var(--ink-2); text-align: center; white-space: nowrap; }
  .fu-prog { margin-top: 40px; width: 680px; padding: 30px 38px 28px; border-radius: 30px; }
  .fu-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .fu-task { display: flex; align-items: center; gap: 14px; font-family: var(--ui); font-weight: 700; font-size: 36px; }
  .fu-task span { display: inline-flex; width: 50px; height: 50px; border-radius: 50%; background: var(--accent-soft);
    color: var(--accent); align-items: center; justify-content: center; }
  .fu-pct { font-family: var(--condensed); font-weight: 700; font-size: 62px; line-height: 1; color: var(--accent);
    font-variant-numeric: tabular-nums; }
  .fu-track { position: relative; height: 18px; margin: 20px 0 18px; border-radius: 9px; background: var(--line); overflow: hidden; }
  .fu-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 9px; background: var(--accent); overflow: hidden; }
  .fu-sheen { position: absolute; top: 0; bottom: 0; left: -40%; width: 70px;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .6), rgba(255, 255, 255, 0)); }
  .fu-sub { font-family: var(--mono); font-weight: 500; font-size: 24px; letter-spacing: .06em; color: var(--muted); }
  .fu-sub b { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
  .fu-file-wrap { position: absolute; left: 180px; top: 800px; width: 720px; }
  .fu-file { display: flex; align-items: center; gap: 28px; padding: 24px 34px 24px 24px; border-radius: 30px;
    transform-origin: 560px 120px; }
  .fu-thumb { position: relative; flex: none; width: 142px; height: 142px; border-radius: 22px; color: #fff;
    background: linear-gradient(150deg, #34332f, #121212); display: flex; align-items: center; justify-content: center; }
  .fu-thumb i { position: absolute; right: 12px; bottom: 12px; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
  .fu-text { flex: 1; min-width: 0; }
  .fu-name { font-family: var(--ui); font-weight: 700; font-size: 44px; line-height: 1.15; white-space: nowrap; }
  .fu-meta { margin-top: 10px; font-family: var(--mono); font-weight: 500; font-size: 26px; letter-spacing: .04em;
    color: var(--muted); white-space: nowrap; }
</style>
<div class="fu-top" id="top">
  <div class="fu-folder" id="folder">
    <div class="fu-ring" id="ring"></div>
    <svg viewBox="0 0 280 214" width="280" height="214">
      <path d="M0 30 Q0 8 22 8 H94 Q106 8 113 17 L126 34 H258 Q280 34 280 56 V192 Q280 214 258 214 H22 Q0 214 0 192 Z" fill="#1B1B1A"/>
      <rect x="26" y="44" width="228" height="70" rx="8" fill="#F5F4F0"/>
      <rect x="0" y="66" width="280" height="148" rx="22" fill="#2A2A28"/>
      <rect x="0" y="66" width="280" height="3" rx="1.5" fill="#3A3A37"/>
    </svg>
    <div class="fu-arrow" id="arrow"></div>
  </div>
  <div class="fu-label" id="label"></div>
  <div class="card fu-prog" id="prog">
    <div class="fu-row">
      <div class="fu-task"><span id="upIcon"></span>Uploading…</div>
      <div class="fu-pct" id="pct">0%</div>
    </div>
    <div class="fu-track"><div class="fu-bar" id="bar"><div class="fu-sheen" id="sheen"></div></div></div>
    <div class="fu-row fu-sub"><span>1 file</span><b id="eta"></b></div>
  </div>
</div>
<div class="fu-file-wrap" id="fileWrap">
  <div class="card fu-file" id="file">
    <div class="fu-thumb" id="thumb"><i></i></div>
    <div class="fu-text"><div class="fu-name" id="name"></div><div class="fu-meta" id="meta"></div></div>
  </div>
</div>
<script>
  (() => {
    const P = GFX.params, D = GFX.duration;
    const EASE = { inOut: "cubic-bezier(.65,0,.35,1)", out: "cubic-bezier(.22,1,.36,1)", in: "cubic-bezier(.55,0,1,.45)",
      back: "cubic-bezier(.34,1.56,.64,1)", expo: "cubic-bezier(.16,1,.3,1)", linear: "linear" };
    // one animation through absolute-time keyframes [{at, ease, ...css}]; ease shapes the segment that starts there
    const track = (el, frames) => {
      const t0 = frames[0].at, span = Math.max(1, frames[frames.length - 1].at - t0);
      return GFX.anim(el, frames.map(({ at, ease, ...css }) => ({ ...css, offset: (at - t0) / span, easing: EASE[ease] || EASE.inOut })),
        { at: t0, dur: span, ease: "linear" });
    };

    GFX.$("#name").textContent = P.filename;
    GFX.$("#meta").textContent = P.meta || "";
    GFX.$("#label").textContent = P.folder_label || "";
    GFX.$("#eta").innerHTML = GFX.icon("clock", { size: 26, width: 2.4 }) + GFX.esc(P.eta || "");
    if (!P.eta) GFX.$("#eta").remove();
    GFX.$("#thumb").insertAdjacentHTML("afterbegin", GFX.icon("film", { size: 64, width: 1.8 }));
    GFX.$("#arrow").innerHTML = GFX.icon("arrowUp", { size: 84, width: 3.2 });
    GFX.$("#upIcon").innerHTML = GFX.icon("upload", { size: 28, width: 2.6 });
    GFX.fit(GFX.$("#name"), { width: 492, max: 44, min: 24 });
    GFX.fit(GFX.$("#label"), { width: 900, max: 26, min: 20 });

    // timing: both in, cursor grabs the file, drags it into the folder, then the upload crawls
    const tGrab = 700, tLift = 790, tDrop = 1320, tGone = 1500, tProg = 1450;
    const top = GFX.$("#top"), folder = GFX.$("#folder"), file = GFX.$("#file");
    GFX.in(folder, "drop", { at: 0, dur: 520 });
    GFX.in(GFX.$("#label"), "fade", { at: 160, dur: 360 });
    GFX.in(GFX.$("#fileWrap"), "rise", { at: 90, dur: 520, ease: "back" });

    // grab point (frame coords) and the folder's centre: the card is pinned to the pointer tip while dragged
    const grab = { x: 740, y: 920 }, target = { x: 540, y: 458 };
    const dx = target.x - grab.x, dy = target.y - grab.y;
    track(file, [
      { at: tGrab - 20, transform: "translate(0px, 0px) scale(1) rotate(0deg)", ease: "out" },
      { at: tLift, transform: "translate(0px, 0px) scale(1.04) rotate(-2deg)", ease: "inOut" },
      { at: tDrop, transform: `translate(${dx}px, ${dy}px) scale(.36) rotate(-6deg)`, ease: "in" },
      { at: tGone, transform: `translate(${dx}px, ${dy + 34}px) scale(.08) rotate(-6deg)` },
    ]);
    track(file, [{ at: tDrop + 40, opacity: 1, ease: "in" }, { at: tGone, opacity: 0 }]);
    GFX.anim(file, [{ boxShadow: "var(--shadow)" }, { boxShadow: "0 50px 90px rgba(17,17,17,.26), 0 10px 24px rgba(17,17,17,.12)" }],
      { at: tGrab, dur: 200 });

    // the folder opens up as the card arrives, then gulps it
    const ring = GFX.$("#ring");
    track(ring, [{ at: 1000, opacity: 0, transform: "scale(.9)", ease: "out" }, { at: 1200, opacity: 1, transform: "scale(1)" },
      { at: tDrop + 60, opacity: 1, transform: "scale(1)", ease: "in" }, { at: tGone + 40, opacity: 0, transform: "scale(1.08)" }]);
    track(GFX.$("#folder svg"), [{ at: 1050, transform: "scale(1)", ease: "out" }, { at: tDrop, transform: "scale(1.08)", ease: "back" },
      { at: tGone + 60, transform: "scale(.96)", ease: "back" }, { at: tGone + 320, transform: "scale(1)" }]);
    const arrow = GFX.$("#arrow");
    track(arrow, [{ at: 1050, transform: "translateY(0px) scale(1)", ease: "out" }, { at: tDrop, transform: "translateY(-6px) scale(1.12)", ease: "back" },
      { at: tGone + 200, transform: "translateY(0px) scale(1)" }]);

    // pointer tip is ~(11, 7) px inside the cursor box. No click ripple: it presses and holds while dragging
    // (pressing the icon, not the cursor box, keeps the tip in place).
    const cur = GFX.cursor([
      { x: 900, y: 1070, at: 380 },
      { x: grab.x - 11, y: grab.y - 7, at: tGrab },
      { x: grab.x - 11, y: grab.y - 7, at: tLift },
      { x: target.x - 11, y: target.y - 7, at: tDrop },
      { x: target.x + 60, y: target.y + 50, at: tGone + 120 },
      { x: 770, y: 640, at: tGone + 620 },
    ]);
    const icon = cur.firstElementChild;
    icon.style.transformOrigin = "20% 12%";
    track(icon, [{ at: tGrab - 60, transform: "scale(1)", ease: "out" }, { at: tGrab + 60, transform: "scale(.84)" },
      { at: tDrop + 40, transform: "scale(.84)", ease: "back" }, { at: tDrop + 220, transform: "scale(1)" }]);

    // after the drop the folder settles to the middle while the upload card appears and crawls
    GFX.anim(top, [{ transform: "translateY(0px)" }, { transform: "translateY(96px)" }], { at: tGone - 80, dur: 620, ease: "expo" });
    const prog = GFX.$("#prog");
    GFX.in(prog, "rise", { at: tProg, dur: 480, ease: "back" });
    const to = Math.max(0, Math.min(100, Number(P.percent_to) || 0));
    const pct = GFX.$("#pct"), bar = GFX.$("#bar");
    const t0 = tProg + 180, t1 = D - 120;
    // stop-start crawl: the rate falls to zero three times, like a real upload that keeps stalling
    const crawl = (u) => u - Math.sin(6 * Math.PI * u) / (6 * Math.PI);
    GFX.each((t) => {
      const u = GFX.clamp((t - t0) / (t1 - t0));
      const v = to * crawl(u);
      pct.textContent = (u >= 1 ? Math.round(to) : Math.floor(v)) + "%";
      bar.style.width = Math.max(v > 0 ? 2.5 : 0, v) + "%";
    }, t0, t1);
    const sweep = 900;
    GFX.anim(GFX.$("#sheen"), [{ left: "-40%" }, { left: "140%" }],
      { at: t0 + 200, dur: sweep, iterations: Math.max(1, Math.floor((D - t0 - 200) / sweep)), ease: "inOut" });
    // the arrow keeps nudging upward while it uploads
    const bob = 640;
    GFX.anim(arrow, [{ translate: "0 0" }, { translate: "0 -12px" }, { translate: "0 0" }],
      { at: tGone + 240, dur: bob, iterations: Math.max(1, Math.floor((D - tGone - 240) / bob)), ease: "inOut" });
  })();
</script>

<style>
  /* phone: 404 x 820, centred inside the content box (y 268-1088); screen 376 x 792 */
  .pf-phone { left: 338px; top: 268px; width: 404px; height: 820px; padding: 14px; border-radius: 64px;
    transform-origin: 50% 60%; }
  .pf-phone .screen { border-radius: 51px; }
  .pf-top { position: absolute; left: 0; right: 0; top: 0; height: 70px; display: flex; align-items: center;
    justify-content: center; gap: 26px; padding-top: 8px; font-family: var(--ui); font-weight: 700; font-size: 21px; color: #fff; }
  .pf-top span { position: relative; }
  .pf-top .dim { color: rgba(255, 255, 255, 0.5); font-weight: 600; }
  .pf-top .on::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 26px; height: 3px; margin-left: -13px;
    border-radius: 2px; background: #fff; }
  .pf-view { position: absolute; left: 0; right: 0; top: 70px; height: 652px; overflow: hidden; background: #1C1C1C; }
  .pf-track { position: absolute; left: 0; top: 0; width: 100%; height: 1304px; }
  .pf-item { position: absolute; left: 0; width: 100%; height: 652px; overflow: hidden; }
  .pf-item .speaker { left: 0; top: 0; width: 100%; height: 100%; object-position: 50% 35%; }
  .pf-shade { position: absolute; left: 0; right: 0; bottom: 0; height: 260px;
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.55)); }
  .pf-side { position: absolute; right: 12px; bottom: 96px; width: 64px; display: flex; flex-direction: column;
    align-items: center; gap: 16px; color: #fff; }
  .pf-av { position: relative; width: 54px; height: 54px; border-radius: 50%; border: 3px solid #fff; background: var(--ink);
    display: flex; align-items: center; justify-content: center; font-family: var(--ui); font-weight: 700; font-size: 24px;
    margin-bottom: 10px; }
  .pf-av b { position: absolute; left: 50%; bottom: -12px; width: 24px; height: 24px; margin-left: -12px; border-radius: 50%;
    background: var(--accent); display: flex; align-items: center; justify-content: center; }
  .pf-act { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .pf-act svg { filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.5)); }
  .pf-act span { font-family: var(--ui); font-weight: 700; font-size: 20px; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    white-space: nowrap; max-width: 64px; text-align: center; }
  .pf-meta { position: absolute; left: 20px; right: 92px; bottom: 30px; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45); }
  .pf-user { font-family: var(--ui); font-weight: 700; font-size: 23px; white-space: nowrap; }
  .pf-cap { margin-top: 6px; font-family: var(--ui); font-weight: 500; font-size: 20px; line-height: 1.3; white-space: nowrap; }
  .pf-snd { margin-top: 4px; display: flex; align-items: center; gap: 8px; font-family: var(--ui); font-weight: 500; font-size: 20px;
    white-space: nowrap; }
  .pf-snd span { min-width: 0; }
  .pf-prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255, 255, 255, 0.25); }
  .pf-prog i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #fff; transform-origin: left center; }
  /* the next item: still loading */
  .pf-next { top: 652px; background: #1E1E1E; }
  .pf-next i { position: absolute; background: #333331; border-radius: 8px; }
  .pf-spin { position: absolute; left: 50%; top: 42%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%;
    border: 4px solid #333331; border-top-color: #6A6A66; }
  .pf-touch { position: absolute; left: 50%; top: 0; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.82); border: 3px solid #fff; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35); opacity: 0; z-index: 6; }
  .pf-nav { position: absolute; left: 0; right: 0; bottom: 0; height: 70px; display: flex; align-items: center;
    justify-content: space-around; padding: 0 22px 6px; color: rgba(255, 255, 255, 0.45); }
  .pf-nav .on { color: #fff; }
  .pf-nav .add { width: 50px; height: 32px; border-radius: 10px; background: #fff; color: #111; display: flex;
    align-items: center; justify-content: center; }
  /* engagement card over the lower right of the phone */
  .pf-card { position: absolute; left: 588px; top: 790px; width: 412px; padding: 26px 30px 22px; border-radius: 28px; z-index: 30; }
  .pf-lab { font-family: var(--mono); font-weight: 700; font-size: 20px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-2); white-space: nowrap; }
  .pf-row { display: flex; align-items: center; gap: 18px; margin-top: 6px; }
  .pf-val { font-family: var(--condensed); font-weight: 700; font-size: 96px; line-height: 1; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pf-delta { display: inline-flex; align-items: center; gap: 8px; border-radius: 12px; padding: 7px 14px; background: var(--accent);
    color: var(--accent-ink); font-family: var(--mono); font-weight: 700; font-size: 24px; white-space: nowrap; flex: none; }
  .pf-spark { display: block; margin-top: 8px; overflow: visible; }
  .pf-spark circle { transform-box: fill-box; transform-origin: center; }
</style>
<div class="phone pf-phone" id="phone">
  <div class="screen">
    <div class="pf-top"><span class="dim">Following</span><span class="on">For You</span></div>
    <div class="pf-view">
      <div class="pf-track" id="track">
        <div class="pf-item" id="cur">
          <img class="speaker" id="me" alt="">
          <div class="pf-shade"></div>
          <div class="pf-side">
            <div class="pf-av" id="av"></div>
            <div class="pf-act" id="likes"></div>
            <div class="pf-act" id="comments"></div>
            <div class="pf-act" id="shares"></div>
          </div>
          <div class="pf-meta">
            <div class="pf-user" id="user"></div>
            <div class="pf-cap" id="cap"></div>
            <div class="pf-snd" id="snd"></div>
          </div>
          <div class="pf-prog"><i id="prog"></i></div>
        </div>
        <div class="pf-item pf-next" id="next">
          <div class="pf-spin" id="spin"></div>
          <i style="left:20px;bottom:74px;width:150px;height:18px"></i>
          <i style="left:20px;bottom:44px;width:230px;height:14px"></i>
        </div>
      </div>
      <div class="pf-touch" id="touch"></div>
    </div>
    <div class="pf-nav" id="nav"></div>
  </div>
</div>
<div class="card pf-card" id="card">
  <div class="pf-lab" id="clabel"></div>
  <div class="pf-row"><div class="pf-val" id="cval"></div><div class="pf-delta" id="cdelta"></div></div>
  <svg class="pf-spark" id="spark" width="352" height="64" viewBox="0 0 352 64"></svg>
</div>
<script>
  (() => {
    const P = GFX.params, D = GFX.duration;
    const phone = GFX.$("#phone"), card = GFX.$("#card");

    // shrink a one-line label until it fits its box; if it still doesn't, trim and add an ellipsis
    const fitLine = (el, max, min) => GFX.layout(() => {
      for (let fs = max; fs >= min; fs--) { el.style.fontSize = fs + "px"; if (el.scrollWidth <= el.clientWidth + 1) return; }
      const full = el.textContent;
      for (let n = full.length - 1; n > 0 && el.scrollWidth > el.clientWidth + 1; n--) el.textContent = full.slice(0, n).trimEnd() + "…";
    });
    const W = (s) => String(s ?? "").trim();

    // current video: speaker, action column, username + two caption lines
    GFX.speaker(GFX.$("#me"));
    const user = W(P.username) || "@creator";
    const handle = user.startsWith("@") ? user : "@" + user;
    GFX.$("#av").innerHTML = GFX.esc(handle.replace(/^@/, "").charAt(0).toUpperCase() || "C") +
      `<b>${GFX.icon("plus", { size: 16, stroke: "#fff", width: 3.6 })}</b>`;
    const ICON = {
      likes: GFX.icon("heart", { size: 44, stroke: "#fff" }),
      comments: '<svg width="42" height="42" viewBox="0 0 24 24" fill="#fff"><path d="M12 3C6.8 3 2.8 6.6 2.8 11c0 2.5 1.3 4.7 3.3 6.2L5.4 21l4.3-2.3c.7.2 1.5.3 2.3.3 5.2 0 9.2-3.6 9.2-8S17.2 3 12 3z"/></svg>',
      shares: '<svg width="42" height="42" viewBox="0 0 24 24" fill="#fff"><path d="M13.5 4.5 22 11.7l-8.5 7.3v-4.2C8.2 14.8 5 16.6 2.5 20c.8-5.6 4-10.3 11-11.3z"/></svg>',
    };
    for (const k of ["likes", "comments", "shares"]) {
      const el = GFX.$("#" + k);
      el.innerHTML = ICON[k] + `<span>${GFX.esc(W(P[k]) || "0")}</span>`;
      fitLine(el.lastChild, 20, 14);
    }
    const u = GFX.$("#user"), cap = GFX.$("#cap"), snd = GFX.$("#snd");
    u.textContent = handle;
    cap.textContent = W(P.caption) || "new video just dropped";
    snd.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" style="flex:none"><path d="M9 17.5V5l11-2v12.5"/>' +
      '<circle cx="6.5" cy="17.5" r="3"/><circle cx="17.5" cy="15.5" r="3"/><path d="M9 5l11-2v3L9 8z"/></svg>' +
      `<span>original sound · ${GFX.esc(handle.replace(/^@/, ""))}</span>`;
    fitLine(u, 23, 16);
    fitLine(cap, 20, 16);
    fitLine(snd.lastChild, 20, 20);
    GFX.$("#nav").innerHTML = [
      `<span class="on">${GFX.icon("home", { size: 30, width: 2.4 })}</span>`,
      GFX.icon("search", { size: 30, width: 2.4 }),
      `<span class="add">${GFX.icon("plus", { size: 22, width: 3.2 })}</span>`,
      GFX.icon("chat", { size: 30, width: 2.4 }),
      GFX.icon("user", { size: 30, width: 2.4 }),
    ].join("");

    // timeline
    const swipe = P.swipe !== false;
    const sw = Math.round(GFX.clamp(D * 0.45, 900, 1600));        // when the swipe starts (video plays first)
    GFX.in(phone, "rise", { at: 0, dur: 540, ease: "back" });
    GFX.anim(phone, [{ scale: "1" }, { scale: "1.02" }], { at: 0, dur: D, ease: "linear" });
    GFX.anim(GFX.$("#prog"), [{ transform: "scaleX(.08)" }, { transform: "scaleX(1)" }],
      { at: 0, dur: swipe ? sw + 560 : D, ease: "linear" });

    if (swipe) {
      const touch = GFX.$("#touch");
      GFX.anim(touch, [
        { opacity: 0, transform: "translateY(480px) scale(.5)" },
        { opacity: 1, transform: "translateY(470px) scale(1)", offset: 0.22 },
        { opacity: 1, transform: "translateY(440px) scale(1)", offset: 0.4 },
        { opacity: 0, transform: "translateY(150px) scale(.9)" },
      ], { at: sw - 160, dur: 700, ease: "out" });
      GFX.anim(GFX.$("#track"), [
        { transform: "translateY(0)", easing: "cubic-bezier(.3,0,.5,1)" },
        { transform: "translateY(-30px)", offset: 0.28, easing: "cubic-bezier(.55,0,.15,1)" },
        { transform: "translateY(-652px)" },
      ], { at: sw, dur: 600, ease: "linear" });
      GFX.anim(GFX.$("#cur"), [{ opacity: 1 }, { opacity: 0 }], { at: sw + 600, dur: 1, fill: "forwards" });
      const spinFrom = sw + 300;
      GFX.anim(GFX.$("#spin"), [{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }],
        { at: spinFrom, dur: 900, iterations: Math.max(1, Math.ceil((D - spinFrom) / 900)), ease: "linear" });
    } else {
      GFX.$("#next").remove();
    }

    // engagement card: value falls, chip pops, sparkline draws itself
    const delta = W(P.card_delta).replace(/^[-−–▼↓+\s]+/, "");
    if (!delta) { card.remove(); return; }
    GFX.$("#clabel").textContent = W(P.card_label) || "Engagement";
    fitLine(GFX.$("#clabel"), 20, 16);
    const val = GFX.$("#cval"), dEl = GFX.$("#cdelta");
    const valText = W(P.card_value) || "0.4%";
    dEl.innerHTML = '<svg width="18" height="14" viewBox="0 0 18 14"><path d="M1 1h16L9 13z" fill="currentColor"/></svg>' + GFX.esc(delta);
    const tc = swipe ? sw + 600 : Math.round(GFX.clamp(D * 0.32, 750, 1100));
    const tEnd = Math.min(tc + 760, D - 300);
    const m = valText.match(/^(\D*?)(\d[\d,]*(?:\.\d+)?)(.*)$/), pct = parseFloat(delta.replace(/,/g, ""));
    val.textContent = valText;
    GFX.layout(() => {          // keep the value inside the card
      const room = 352 - dEl.offsetWidth - 18;
      for (let fs = 96; fs > 40 && val.scrollWidth > room; fs -= 2) val.style.fontSize = fs + "px";
    });
    if (m && pct > 0 && pct < 100) {
      const to = parseFloat(m[2].replace(/,/g, "")), dec = (m[2].split(".")[1] || "").length;
      GFX.count(val, to / (1 - pct / 100), to, { at: tc + 60, dur: tEnd - tc - 60, decimals: dec, prefix: m[1], suffix: m[3],
        group: m[2].includes(",") });
    }
    const pts = [];
    for (let i = 0; i <= 24; i++) {
      const x = i / 24, y = 1 - (1 / (1 + Math.exp(-(x - 0.42) * 9))) * 0.9 + Math.sin(x * 11) * 0.03;
      pts.push([6 + x * 330, 6 + (1 - y) * 48]);
    }
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const last = pts[pts.length - 1];
    GFX.$("#spark").innerHTML = `<line x1="6" y1="58" x2="346" y2="58" stroke="var(--line)" stroke-width="3" stroke-dasharray="5 9"/>
      <path id="sline" d="${d}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
        pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000"/>
      <circle id="sdot" cx="${last[0]}" cy="${last[1]}" r="8" fill="var(--accent)" stroke="#fff" stroke-width="4"/>`;
    GFX.anim(card, [
      { opacity: 0, transform: "translate(40px, 60px) scale(.55) rotate(9deg)" },
      { opacity: 1, transform: "translate(0, 0) scale(1) rotate(2.5deg)" },
    ], { at: tc - 160, dur: 520, ease: "snap" });
    GFX.anim(GFX.$("#sline"), [{ strokeDashoffset: 1000 }, { strokeDashoffset: 0 }], { at: tc + 60, dur: tEnd - tc - 60, ease: "inOut" });
    GFX.in(GFX.$("#sdot"), "pop", { at: tEnd - 40, dur: 300 });
    GFX.in(dEl, "pop", { at: Math.min(tc + 480, D - 480), dur: 380 });
  })();
</script>

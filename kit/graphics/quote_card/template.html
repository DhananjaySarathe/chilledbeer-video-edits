<style>
  .qc-stage { display: flex; flex-direction: column; justify-content: center; }
  .qc-card { position: relative; margin: 0 16px; padding: 64px 64px 56px; }
  .qc-mark { position: absolute; font-family: var(--display); color: var(--accent); line-height: 1; pointer-events: none;
    transform-origin: 50% 24%; }
  .qc-mark.open { left: 34px; top: -118px; font-size: 330px; }
  .qc-mark.close { right: 40px; bottom: -262px; font-size: 330px; }
  .qc-head { display: flex; align-items: center; justify-content: flex-end; gap: 22px; min-height: 60px; margin-bottom: 30px; }
  .qc-label { font-family: var(--mono); font-weight: 700; font-size: 24px; letter-spacing: 0.26em; color: var(--muted);
    text-transform: uppercase; white-space: nowrap; }
  .qc-stars { display: flex; gap: 8px; }
  .qc-star { position: relative; width: 58px; height: 58px; color: var(--line); }
  .qc-star svg { position: absolute; inset: 0; }
  .qc-star .on { position: absolute; inset: 0; color: var(--accent); }
  .qc-quote { position: relative; width: 100%; font-family: var(--display); text-transform: uppercase; color: var(--ink); font-size: 120px;
    line-height: 1; text-wrap: balance; }
  .qc-w { display: inline-block; }
  .qc-foot { display: flex; align-items: center; gap: 20px; margin-top: 40px; }
  .qc-rule { width: 56px; height: 6px; border-radius: 3px; background: var(--accent); transform-origin: left center; flex: none; }
  .qc-author { font-family: var(--mono); font-weight: 700; font-size: 26px; letter-spacing: 0.2em; color: var(--ink-2);
    text-transform: uppercase; white-space: nowrap; }
</style>
<div class="stage qc-stage">
  <div class="card qc-card" id="card">
    <div class="qc-mark open" id="open">&ldquo;</div>
    <div class="qc-head" id="head"><div class="qc-label" id="label"></div><div class="qc-stars" id="stars"></div></div>
    <div class="qc-quote" id="quote"></div>
    <div class="qc-foot" id="foot"><i class="qc-rule" id="rule"></i><span class="qc-author" id="author"></span></div>
    <div class="qc-mark close" id="close">&rdquo;</div>
  </div>
</div>
<script>
  (() => {
    const P = GFX.params, D = GFX.duration;
    const card = GFX.$("#card"), quote = GFX.$("#quote"), head = GFX.$("#head"), starsEl = GFX.$("#stars");
    const words = String(P.quote || "").trim().replace(/^["“”']+|["“”']+$/g, "").split(/\s+/).filter(Boolean);
    const wordEls = words.map((w) => GFX.h("span", { class: "qc-w", text: w }));
    wordEls.forEach((el, i) => { if (i) quote.append(" "); quote.append(el); });

    const hasStars = P.stars != null && P.stars !== "" && Number.isFinite(Number(P.stars));
    const rating = hasStars ? Math.round(Math.min(5, Math.max(0, Number(P.stars))) * 2) / 2 : 0;
    if (P.label) GFX.$("#label").textContent = P.label; else GFX.$("#label").remove();
    const fills = [];
    if (hasStars) {
      for (let i = 0; i < 5; i++) {
        const slot = GFX.h("div", { class: "qc-star", html: GFX.icon("star", { size: 58 }) });
        const part = Math.min(1, Math.max(0, rating - i));
        if (part > 0) {
          const on = GFX.h("div", { class: "on", html: GFX.icon("star", { size: 58 }) });
          if (part < 1) on.style.clipPath = "inset(0 50% 0 0)";
          slot.append(on);
          fills.push(on);
        }
        starsEl.append(slot);
      }
    } else starsEl.remove();
    if (!P.label && !hasStars) { head.remove(); card.style.paddingTop = "96px"; }
    if (P.author) GFX.$("#author").textContent = P.author; else GFX.$("#foot").remove();

    // the quote wraps inside the card and shrinks until it fits (at most ~5 lines tall)
    // (measured on the words' layout boxes: their entrance transforms would inflate scrollHeight)
    GFX.layout(() => {
      const W = quote.clientWidth, H = P.author ? 480 : 540;
      const fits = (s) => {
        quote.style.fontSize = s + "px";
        return wordEls.every((el) => el.offsetLeft + el.offsetWidth <= W + 1 && el.offsetTop + el.offsetHeight <= H);
      };
      let lo = 54, hi = 230;
      for (let k = 0; k < 16; k++) { const m = (lo + hi) / 2; if (fits(m)) lo = m; else hi = m; }
      quote.style.fontSize = Math.floor(lo) + "px";
    });

    // timeline: card rises, the opening mark stamps, words rise out of their line one by one,
    // stars fill one by one, the author slides in, the closing mark lands last
    GFX.in(card, "rise", { at: 0, dur: 500, ease: "back" });
    GFX.anim(GFX.$("#open"), [{ opacity: 0, transform: "scale(1.9) rotate(-18deg)" }, { opacity: 1, transform: "scale(1) rotate(0deg)" }],
      { at: 140, dur: 420, ease: "snap" });
    if (P.label || hasStars) GFX.in(head, "fade", { at: 180, dur: 300 });
    const t0 = 260, stagger = Math.min(70, 700 / Math.max(1, words.length));
    wordEls.forEach((el, i) => GFX.anim(el, [
      { transform: "translateY(100%)", clipPath: "inset(-10% -5% 100% -5%)" },
      { transform: "translateY(0)", clipPath: "inset(-10% -5% -10% -5%)" },
    ], { at: t0 + i * stagger, dur: 440, ease: "expo" }));
    const tWords = t0 + (words.length - 1) * stagger + 440;
    fills.forEach((el, i) => GFX.anim(el, [{ opacity: 0, transform: "scale(0) rotate(-72deg)" },
      { opacity: 1, transform: "scale(1.25) rotate(0deg)", offset: 0.6 }, { opacity: 1, transform: "scale(1) rotate(0deg)" }],
      { at: 420 + i * 150, dur: 380, ease: "out" }));
    const tStars = fills.length ? 420 + (fills.length - 1) * 150 + 380 : 0;
    if (P.author) {
      const at = Math.min(D - 700, Math.max(760, tWords - 150));
      GFX.anim(GFX.$("#rule"), [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { at, dur: 360, ease: "inOut" });
      GFX.in(GFX.$("#author"), "left", { at: at + 100, dur: 420, ease: "expo" });
    }
    const tClose = Math.min(D - 500, Math.max(tWords, tStars) + 60);
    GFX.anim(GFX.$("#close"), [{ opacity: 0, transform: "scale(0.2) rotate(40deg)" }, { opacity: 1, transform: "scale(1) rotate(0deg)" }],
      { at: tClose, dur: 420, ease: "back" });
    GFX.anim(card, [{ scale: "1" }, { scale: "1.025" }], { at: 400, dur: Math.max(600, D - 400), ease: "linear" });
  })();
</script>

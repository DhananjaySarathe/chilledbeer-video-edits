<style>
  .rc-group { position: absolute; left: 64px; right: 64px; top: 292px; display: flex; flex-direction: column;
    align-items: center; }
  .rc-card { display: flex; align-items: center; justify-content: space-between; gap: 56px; min-width: 660px;
    padding: 30px 40px 30px 44px; border-radius: 26px; background: var(--card);
    box-shadow: 0 22px 60px rgba(0, 0, 0, 0.24), 0 4px 14px rgba(0, 0, 0, 0.12); }
  .rc-card.solo { min-width: 0; justify-content: center; }
  .rc-label { font-family: var(--mono); font-weight: 500; font-size: 26px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .rc-stars { display: flex; gap: 12px; }
  .rc-star { position: relative; width: 60px; height: 60px; }
  .rc-star .off, .rc-star .on { position: absolute; inset: 0; }
  .rc-star svg { display: block; width: 100%; height: 100%; }
  .rc-star .off { color: #DCDBD5; }
  .rc-star .on { color: var(--accent); }
  .rc-star .on.half { clip-path: inset(0 50% 0 0); }
  .rc-ring { position: absolute; inset: -14px; border-radius: 50%; border: 4px solid var(--accent); opacity: 0; }
  .rc-quote { margin-top: 30px; font-family: var(--display); font-size: 150px; line-height: 1.02; color: #FFFFFF;
    text-transform: uppercase; white-space: nowrap; letter-spacing: 0.005em;
    text-shadow: 0 6px 26px rgba(0, 0, 0, 0.38), 0 2px 6px rgba(0, 0, 0, 0.28); }
</style>
<div class="rc-group" id="group">
  <div class="rc-card" id="card">
    <div class="rc-label" id="label"></div>
    <div class="rc-stars" id="stars"></div>
  </div>
  <div class="rc-quote" id="quote"></div>
</div>
<script>
  (() => {
    const P = GFX.params, D = GFX.duration;
    const group = GFX.$("#group"), card = GFX.$("#card"), label = GFX.$("#label"), quote = GFX.$("#quote");
    const rating = Math.round(GFX.clamp(Number(P.stars) || 0, 0, 5) * 2) / 2;
    label.textContent = P.label || "";
    if (!P.label) { label.remove(); card.classList.add("solo"); }

    // five stars: a grey one with an accent one on top that pops in (half-clipped for .5)
    const star = GFX.icon("star", { size: 60, fill: "currentColor", stroke: "currentColor", width: 1.6 });
    const t0 = 300, step = Math.min(170, 520 / Math.max(1, Math.ceil(rating)));
    let lastAt = t0 - step;
    for (let i = 0; i < 5; i++) {
      const s = GFX.h("div", { class: "rc-star" }, GFX.h("div", { class: "off", html: star }));
      GFX.$("#stars").append(s);
      if (i >= Math.ceil(rating)) continue;
      const on = GFX.h("div", { class: "on" + (rating - i === 0.5 ? " half" : ""), html: star });
      const ring = GFX.h("div", { class: "rc-ring" });
      s.append(ring, on);
      const at = t0 + i * step;
      lastAt = at;
      GFX.anim(on, [{ opacity: 0, transform: "scale(0) rotate(-40deg)" }, { opacity: 1, transform: "scale(1.35) rotate(6deg)", offset: 0.55 },
        { opacity: 1, transform: "scale(1) rotate(0)" }], { at, dur: 380, ease: "out" });
      GFX.anim(ring, [{ opacity: 0, transform: "scale(.35)" }, { opacity: 0.8, offset: 0.12 }, { opacity: 0, transform: "scale(1.25)" }], { at: at + 40, dur: 420, ease: "out" });
    }

    // the card drops in; the quote lands after the last star and keeps a slow push
    GFX.anim(card, [{ opacity: 0, transform: "translateY(-46px) scale(.92)" }, { opacity: 1, transform: "translateY(0) scale(1)" }],
      { at: 0, dur: 420, ease: "back" });
    const words = String(P.quote || "").trim().replace(/^["'“”‘’]+|["'“”‘’]+$/g, "");
    if (words) {
      quote.textContent = "“" + words + "”";
      GFX.fit(quote, { width: 952, max: 150, min: 64 });
      const at = Math.max(760, lastAt + 260);
      GFX.anim(quote, [{ opacity: 0, transform: "scale(1.4)", filter: "blur(10px)" }, { opacity: 1, transform: "scale(1)", filter: "blur(0)" }],
        { at, dur: 380, ease: "expo" });
      GFX.anim(quote, [{ scale: "1" }, { scale: "1.035" }], { at: at + 380, dur: Math.max(300, D - at - 380), ease: "linear" });
    } else quote.remove();

    // keep clear of the mouth when the face is known: lift the group, then shrink the quote if still needed
    if (GFX.face) GFX.layout(() => {
      const mouth = GFX.face.y + GFX.face.h * 0.7 - 30;
      let r = group.getBoundingClientRect();
      if (r.bottom > mouth) group.style.top = Math.max(270, 292 - (r.bottom - mouth)) + "px";
      r = group.getBoundingClientRect();
      if (words && r.bottom > mouth) quote.style.fontSize = Math.max(64, parseFloat(getComputedStyle(quote).fontSize) - (r.bottom - mouth)) + "px";
    });
  })();
</script>

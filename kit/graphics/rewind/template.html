<style>
  .rw { position: absolute; inset: 0; overflow: hidden; }
  .rw-dim { position: absolute; inset: 0; background: rgba(8, 8, 12, 0.52); }
  .rw-bar { position: absolute; left: 0; right: 0; background: rgba(255, 255, 255, 0.78); mix-blend-mode: screen; }
  .rw-streak { position: absolute; left: 0; right: 0; height: 6px; }
  .rw-mid { position: absolute; left: 64px; width: 886px; top: 700px; display: flex; flex-direction: column; align-items: center; }
  .rw-sym { display: flex; align-items: center; gap: 26px; color: #fff; filter: drop-shadow(-5px 0 0 rgba(0, 229, 255, 0.7)) drop-shadow(5px 0 0 rgba(255, 0, 170, 0.7)); }
  .rw-sym svg { display: block; }
  .rw-word { font-family: var(--display); font-size: 170px; line-height: 1; text-transform: uppercase; letter-spacing: 0.02em; }
  .rw-tc { margin-top: 14px; font-family: var(--mono); font-weight: 700; font-size: 34px; letter-spacing: 0.16em; color: #fff;
    opacity: 0.9; font-variant-numeric: tabular-nums; }
  .rw-label { margin-top: 22px; font-family: var(--condensed); font-weight: 700; font-size: 58px; text-transform: uppercase;
    letter-spacing: 0.03em; color: var(--accent-ink); background: var(--accent); padding: 8px 30px 6px; border-radius: 999px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35); white-space: nowrap; }
  .rw-osd { position: absolute; left: 76px; top: 300px; font-family: var(--mono); font-weight: 700; font-size: 38px;
    color: #fff; letter-spacing: 0.1em; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); }
</style>
<div class="rw" id="rw">
  <div class="rw-dim" id="dim"></div>
  <div id="bars"></div>
  <div class="rw-osd" id="osd">◀◀ REW</div>
  <div class="rw-mid" id="mid">
    <div class="rw-sym" id="sym"><span id="tri"></span><span class="rw-word" id="word"></span></div>
    <div class="rw-tc" id="tc"></div>
    <div class="rw-label" id="label"></div>
  </div>
</div>
<script>
  (() => {
    const P = GFX.params, D = GFX.duration;
    const rw = GFX.$("#rw"), bars = GFX.$("#bars"), mid = GFX.$("#mid"), word = GFX.$("#word"), tri = GFX.$("#tri"),
      tc = GFX.$("#tc"), label = GFX.$("#label"), osd = GFX.$("#osd");
    word.textContent = String(P.text || "Rewind");
    label.textContent = String(P.label || "");
    if (!P.label) label.style.display = "none";
    tri.innerHTML = '<svg width="190" height="130" viewBox="0 0 190 130"><path d="M95 8 L8 65 L95 122 Z M182 8 L95 65 L182 122 Z" fill="#fff"/></svg>';
    GFX.layout(() => {
      GFX.fitLine(word, { width: 620, max: 170, min: 90 });
      if (GFX.face) mid.style.top = Math.round(Math.max(420, Math.min(760, GFX.face.y + GFX.face.h * 0.2))) + "px";
    });

    // tracking bars and colour streaks race upwards (seeded, so every frame is reproducible)
    const rnd = GFX.rand(7);
    const bands = [];
    for (let i = 0; i < 7; i++) {
      const el = GFX.h("i", { class: "rw-bar" });
      const h = 14 + rnd() * 70;
      el.style.height = h + "px";
      el.style.opacity = String(0.25 + rnd() * 0.45);
      bars.append(el);
      bands.push({ el, y0: 1920 + rnd() * 1920, v: 2.6 + rnd() * 2.2 });
    }
    for (let i = 0; i < 10; i++) {
      const el = GFX.h("i", { class: "rw-streak" });
      el.style.background = i % 2 ? "rgba(0, 229, 255, 0.55)" : "rgba(255, 0, 170, 0.55)";
      bars.append(el);
      bands.push({ el, y0: rnd() * 3840, v: 3.5 + rnd() * 3 });
    }
    const fadeIn = 90, fadeOut = Math.min(220, D * 0.25);
    GFX.each((t) => {
      for (const b of bands) b.el.style.transform = `translateY(${((b.y0 - t * b.v) % 3840 + 3840) % 3840 - 1920}px)`;
      // timecode running backwards, as a tape does when rewinding
      const s = Math.max(0, 86399 - t * 45);          // t is in ms: about 12 hours of tape per second
      const hh = String(Math.floor(s / 3600) % 100).padStart(2, "0"), mm = String(Math.floor(s / 60) % 60).padStart(2, "0"),
        ss = String(Math.floor(s) % 60).padStart(2, "0");
      tc.textContent = `${hh}:${mm}:${ss}`;
    }, 0, D);
    // small horizontal jitter on the symbol, like a tape that won't sit still
    GFX.anim(GFX.$("#sym"), [{ translate: "0 0" }, { translate: "-10px 0" }, { translate: "8px 0" }, { translate: "-4px 0" }, { translate: "0 0" }],
      { at: 0, dur: 260, iterations: Math.max(1, Math.floor(D / 260)), ease: "linear" });
    GFX.anim(rw, [{ opacity: 0 }, { opacity: 1 }], { at: 0, dur: fadeIn, ease: "out" });
    GFX.anim(rw, [{ opacity: 1 }, { opacity: 0 }], { at: D - fadeOut, dur: fadeOut, ease: "in" });
    GFX.in(mid, "zoom", { at: 30, dur: 240 });
    if (P.label) GFX.in(label, "pop", { at: 180, dur: 260 });
    GFX.anim(osd, [{ opacity: 1 }, { opacity: 0.25 }, { opacity: 1 }], { at: 0, dur: 300, iterations: Math.max(1, Math.floor(D / 300)) });
  })();
</script>

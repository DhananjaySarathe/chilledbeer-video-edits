<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--HF:KIT-->
  </head>
  <body>
    <div id="root" data-composition-id="motiondemo" data-start="0" data-duration="__TOTAL__" data-width="1920" data-height="1080" style="position:relative;width:1920px;height:1080px;overflow:hidden">
      <video id="aroll" class="clip" src="assets/aroll.mp4" muted playsinline data-start="0" data-duration="__TOTAL__" data-media-start="0" data-track-index="2"></video>
    </div>
    <script>
      /*DATA*/
      (function () {
        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["motiondemo"] = tl;                                         // the linter looks for this line
        const K = HF.kit({ tl, id: "motiondemo", width: 1920, height: 1080, words: D.words, pieces: D.pieces });
        const st = HF.stage(K, document.getElementById("root"), { aroll: "aroll" });
        // camera v2 from the build's plan (director + baked blur), or the old camera for the "before" render
        if (D.camera) HF.camera(K, st, { plan: D.camera });
        else HF.camera.v1(K, st, { framing: { max: "W", ultra: "W" } });
        // the move on screen, named (the director's own decisions)
        D.labels.forEach(([a, b, text]) => HF.chapter(K, st.top, Math.max(0.05, a), Math.min(D.total, Math.max(b, a + 1.2)), null, text));
        K.finish(D.total);
      })();
    </script>
  </body>
</html>

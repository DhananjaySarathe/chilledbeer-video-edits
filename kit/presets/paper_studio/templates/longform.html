<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "InstrumentSerif"; src: url("assets/fonts/InstrumentSerif-Regular.ttf"); font-weight: 400; font-style: normal; font-display: block; }
      @font-face { font-family: "InstrumentSerif"; src: url("assets/fonts/InstrumentSerif-Italic.ttf"); font-weight: 400; font-style: italic; font-display: block; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-500.ttf"); font-weight: 500; font-display: block; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.ttf"); font-weight: 600; font-display: block; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-700.ttf"); font-weight: 700; font-display: block; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-800.ttf"); font-weight: 800 900; font-display: block; }
      @font-face { font-family: "JBMono"; src: url("assets/fonts/JetBrainsMono-500.ttf"); font-weight: 500; font-display: block; }
      @font-face { font-family: "JBMono"; src: url("assets/fonts/JetBrainsMono-700.ttf"); font-weight: 700; font-display: block; }
      :root { --paper: #f3eee6; --card: #ffffff; --ink: #1b1815; --ink2: #4a443d; --mute: #8a8178; --line: rgba(27, 24, 21, 0.1); --acc: #e2562b; --ok: #2f8a5b; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); font-family: "Inter", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
      .abs { position: absolute; }
      .fill { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .paper { background: radial-gradient(120% 90% at 50% 35%, #f8f4ed 0%, #f1ebe2 60%, #e9e2d7 100%); }
      .grain { background-image: radial-gradient(rgba(27, 24, 21, 0.05) 1px, transparent 1.2px); background-size: 36px 36px; }
      .serif { font-family: "InstrumentSerif", serif; font-weight: 400; letter-spacing: -0.01em; line-height: 0.98; white-space: nowrap; }
      .serif i, i.acc { font-style: italic; color: var(--acc); }
      .lbl { font: 700 20px "Inter", sans-serif; letter-spacing: 0.22em; text-transform: uppercase; color: var(--acc); white-space: nowrap; }
      .m { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.06em 0.06em 0.2em; margin: -0.06em -0.06em -0.2em; }
      .wi { display: inline-block; }
      .card { position: absolute; border-radius: 26px; background: var(--card); box-shadow: 0 1px 0 rgba(27, 24, 21, 0.04), 0 22px 60px rgba(60, 40, 20, 0.14); border: 1px solid rgba(27, 24, 21, 0.06); }
      .pill { position: absolute; display: inline-flex; align-items: center; gap: 12px; border-radius: 999px; padding: 14px 24px; font: 600 26px "Inter", sans-serif; white-space: nowrap;
        background: #fff; color: var(--ink); box-shadow: 0 12px 34px rgba(60, 40, 20, 0.14); border: 1px solid rgba(27, 24, 21, 0.06); }
      .win { position: absolute; border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 2px 0 rgba(27, 24, 21, 0.04), 0 40px 110px rgba(60, 40, 20, 0.22); border: 1px solid rgba(27, 24, 21, 0.08); }
      .win .bar { position: absolute; left: 0; top: 0; width: 100%; height: 46px; background: #f6f3ee; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 9px; padding: 0 18px; }
      .win .bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
      .win .url { margin-left: 18px; height: 28px; flex: 1; max-width: 680px; border-radius: 8px; background: #fff; border: 1px solid var(--line); color: var(--ink2);
        font: 500 16px "JBMono", monospace; display: flex; align-items: center; padding: 0 14px; }
      .win .view { position: absolute; left: 0; top: 46px; width: 100%; bottom: 0; overflow: hidden; }
      .win .view img { position: absolute; left: 0; top: 0; width: 100%; display: block; }
      .phone { position: absolute; overflow: hidden; background: #000; border: 5px solid #1b1815; box-shadow: 0 30px 80px rgba(60, 40, 20, 0.28); }
      .phone video, .phone img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .code { font: 500 20px/1.6 "JBMono", monospace; color: #2d2823; white-space: pre; }
      #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 2; filter: drop-shadow(0 22px 40px rgba(50, 30, 15, 0.28)); }
      #wrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
      #aroll { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #ring { position: absolute; border-radius: 26px; border: 5px solid #fff; z-index: 5; opacity: 0; pointer-events: none; }
      #ins { z-index: 3; }
      #cards { z-index: 5; }
      #top { z-index: 6; }
      #launch { z-index: 8; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="howiedit" data-start="0" data-duration="__TOTAL__" data-width="1920" data-height="1080">
      <div class="fill paper"></div>
      <div id="cam"><div id="wrap"><!--AROLL--></div></div>
      <div id="ring"></div>
      <div id="ins" class="layer"></div>
      <div id="cards" class="layer"></div>
      <div id="top" class="layer"></div>
      <div id="launch" class="layer"></div>
    </div>
    <script>
      /*DATA*/
      (function () {
        const C = { paper: "#f3eee6", ink: "#1b1815", ink2: "#4a443d", mute: "#8a8178", acc: "#e2562b", ok: "#2f8a5b", line: "rgba(27,24,21,.1)" };
        const ICON = {
          cam: '<rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="M16 10l5-3v10l-5-3z"/>', broom: '<path d="M14 3l7 7M11 6l7 7-6 6H6v-6z"/><path d="M6 19l-3 2"/>',
          map: '<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>', search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
          code: '<path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/>', play: '<path d="M8 5.5v13l11-6.5z"/>', check: '<path d="M4.5 12.5l5 5 10-11"/>',
          x: '<path d="M6 6l12 12M18 6L6 18"/>', bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>', music: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
          box: '<path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>', spark: '<path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6z"/>',
          star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>', chat: '<path d="M4 5h16v11H9l-5 4z"/>',
          film: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>', layers: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
          lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>', file: '<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/>',
          cut: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.1 8.1L20 20M8.1 15.9L20 4"/>', sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
          wave: '<path d="M3 12h2M7 8v8M11 5v14M15 8v8M19 10v4"/>',
        };
        const icon = (n, size = 32, stroke = "currentColor", width = 2.2, fill = "none") =>
          `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill}" stroke="${stroke}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
        const $ = (id) => document.getElementById(id);
        const el = (parent, style, html = "", cls = "abs") => { const d = document.createElement("div"); d.className = cls; d.style.cssText = style; d.innerHTML = html; parent.append(d); return d; };
        const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
        const P = D.pieces, Wd = D.words;
        const span = (tag) => { const ps = P.filter((p) => p.tag === tag); if (!ps.length) throw new Error("tag " + tag); return [ps[0].out_a, ps[ps.length - 1].out_b]; };
        const W = (i) => { const w = Wd.find((x) => x.i === i); if (!w) throw new Error("word " + i); return w.t; };
        const tl = gsap.timeline({ paused: true });
        const Q = (t) => Math.round(t * 30) / 30;
        window.__CUES = [];
        const sfx = (name, t, db) => window.__CUES.push({ name, at: Math.round(t * 1000) / 1000, gain_db: db });
        const S = { swish: "whoosh/whoosh__air-woosh__mixkit-1489", slide: "whoosh/whoosh__technology-transition-slide__mixkit-3120", click: "ui/ui__clear-mouse-clicks__mixkit-2997",
          pop: "ui/ui__bubble-pop-up-alert-notification__mixkit-2357", check: "ui/ui__modern-click-box-check__mixkit-1120", type: "typing/typing__typing-on-a-laptop-keyboard__mixkit-2531",
          tone: "ui/ui__confirmation-tone__mixkit-2867", hit: "impact/impact__short-bass-hit__mixkit-2299", riser: "riser/riser__cinematic-synth-riser__mixkit-645" };

        // ------------------------------------------------ motion: calm and exact. Entrances 0.6 s power3.out with a short travel,
        // exits 0.35 s power2.in, text rises line by line inside a mask. No bounces, no glitches.
        const show = (e, a, b) => { tl.set(e, { autoAlpha: 0 }, 0); tl.set(e, { autoAlpha: 1 }, Q(a)); if (b != null) tl.set(e, { autoAlpha: 0 }, Q(b)); };
        const enter = (e, t, from = {}, dur = 0.6) => tl.fromTo(e, { opacity: 0, y: 28, filter: "blur(8px)", ...from },
          { opacity: 1, x: 0, y: 0, scale: 1, rotation: 0, filter: "blur(0px)", duration: dur, ease: "power3.out" }, Q(t));
        const exit = (e, t, to = {}) => tl.to(e, { opacity: 0, y: -16, filter: "blur(6px)", duration: 0.35, ease: "power2.in", ...to }, Q(t));
        const fade = (e, t, dur = 0.4) => tl.fromTo(e, { opacity: 0 }, { opacity: 1, duration: dur, ease: "power1.out" }, Q(t));
        const drift = (e, a, b, s1 = 1.035) => tl.fromTo(e, { scale: 1 }, { scale: s1, duration: Math.max(0.3, b - a), ease: "none" }, Q(a));
        function words(parent, str, style) {
          const box = el(parent, style, "", "serif abs"), ws = [];
          str.split("|").forEach((line, li) => {
            if (li) box.append(document.createElement("br"));
            line.trim().split(/\s+/).forEach((tok, i, arr) => {
              const m = document.createElement("span"); m.className = "m";
              const w = document.createElement("span"); w.className = "wi"; w.textContent = tok.replace(/^\*/, "");
              if (tok[0] === "*") { w.style.fontStyle = "italic"; w.style.color = C.acc; }
              m.append(w); box.append(m); if (i < arr.length - 1) box.append(" ");
              ws.push(w);
            });
          });
          return { box, ws };
        }
        const rise = (ws, ts, outAt) => ws.forEach((w, k) => {
          const t = ts[Math.min(k, ts.length - 1)] + (k >= ts.length ? (k - ts.length + 1) * 0.07 : 0);
          tl.fromTo(w, { yPercent: 115 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, Q(t));
          if (outAt != null) tl.to(w, { yPercent: -115, duration: 0.3, ease: "power2.in" }, Q(outAt + k * 0.025));
        });
        function typeText(e, text, t, cps, caret = true) {
          const o = { n: 0 };
          tl.set(e, { textContent: caret ? "▍" : "" }, 0);
          tl.to(o, { n: text.length, duration: text.length / cps, ease: "none", onUpdate: () => { e.textContent = text.slice(0, Math.round(o.n)) + (caret && o.n < text.length ? "▍" : ""); } }, Q(t));
        }
        function countUp(e, a, b, t, dur, fmt = (v) => Math.round(v)) {
          const o = { v: a };
          tl.set(e, { textContent: fmt(a) }, 0);
          tl.to(o, { v: b, duration: dur, ease: "power3.out", onUpdate: () => { e.textContent = fmt(o.v); } }, Q(t));
        }
        let VID = 0;                                                       // media need a unique id to be tracked by the renderer
        const phone = (parent, src, cx, cy, h, start, dur, media = 0, rot = 0) => {
          const w = Math.round((h * 9) / 16), p = el(parent, `left:${cx - w / 2}px;top:${cy - h / 2}px;width:${w}px;height:${h}px;border-radius:${Math.round(h * 0.07)}px;transform:rotate(${rot}deg)`, "", "phone");
          p.innerHTML = `<video id="v${VID++}" class="clip" src="assets/broll/${src}.mp4" muted playsinline data-start="${start.toFixed(3)}" data-duration="${dur.toFixed(3)}" data-media-start="${media}" data-track-index="5"></video>`;
          return p;
        };
        function win(parent, x, y, w, h, url, img) {
          const d = el(parent, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;opacity:0`, "", "win");
          d.innerHTML = `<div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><div class="url">${url}</div></div><div class="view">${img ? `<img src="${img}" alt="">` : ""}</div>`;
          return d;
        }
        const card = (parent, x, y, w, h, html = "", extra = "") => el(parent, `left:${x}px;top:${y}px;width:${w}px;${h ? `height:${h}px;` : ""}opacity:0;${extra}`, html, "card");
        const pill = (parent, x, y, html, extra = "") => el(parent, `left:${x}px;top:${y}px;opacity:0;${extra}`, html, "pill");
        // a layer of side content (over the wall, next to the speaker)
        function side(a, b) { const L = el($("cards"), "left:0;top:0;width:1920px;height:1080px"); show(L, a - 0.05, b + 0.45); return L; }
        // a full-screen insert on paper; it rises in, and leaves with a short fade
        function insert(a, b, keep = false) {
          const L = el($("ins"), "left:0;top:0;width:1920px;height:1080px;opacity:0");
          el(L, "", "", "fill paper"); el(L, "opacity:.6", "", "fill grain");
          tl.fromTo(L, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, Q(a - 0.2));
          if (!keep) tl.to(L, { opacity: 0, duration: 0.35, ease: "power2.in" }, Q(b - 0.1));
          else tl.set(L, { opacity: 0 }, Q(b + 0.5));
          sfx(S.swish, a - 0.22, -21);
          return L;
        }
        // side columns, measured from the framing below: the speaker sits right (content at x 110..830) or left (1090..1810)
        const LEFT = 110, RIGHT = 1150, COLW = 680;

        // ================================================ THE SPEAKER: the real room, a new framing on every cut
        // W wide, M medium, C close, SR speaker right (content left), SL speaker left (content right), PIP corner window, OFF hidden
        const FR = { hello: "W", noeditor: "SR", magic: "SL", workflow: "SR", screen: "PIP", weekend: "SL", aieditor: "SR", whole: "PIP", record: "M",
          cleanup: "SL", skill: "SL", plan: "SL", presets: "SL", search: "PIP", repos: "PIP", extracted: "PIP", suggest: "PIP", code: "SL", hyperframes: "PIP",
          link: "PIP", assets: "SR", ncs: "PIP", library: "SR", slow: "SL", optimise: "SL", lost: "SR", again: "SL", minutes: "SR", cache: "PIP", faster: "OFF",
          recap: "PIP", repo: "SL", caveat: "SL", comment: "SR", style: "SR", own: "OFF", launchask: "SL", launchgo: "C" };
        const SC = { W: [1.0, 1.08], M: [1.14, 1.22], C: [1.3, 1.22], SR: [1.2, 1.28], SL: [1.32, 1.38] };
        const PIPBOX = { x: 1556, y: 716, s: 316 }, PIPS = 0.5;
        function place(lay, f, v) {
          const [cx, cy] = f;
          if (lay === "PIP" || lay === "OFF") {
            const s = PIPS, half = PIPBOX.s / 2 / s, fy = cy + 70;
            const x = PIPBOX.x + PIPBOX.s / 2 - cx * s, y = PIPBOX.y + PIPBOX.s / 2 - fy * s;
            const clip = `inset(${(fy - half).toFixed(1)}px ${(1920 - cx - half).toFixed(1)}px ${(1080 - fy - half).toFixed(1)}px ${(cx - half).toFixed(1)}px round ${(26 / s).toFixed(1)}px)`;
            return { x, y, scale: s, clipPath: clip };
          }
          const s = SC[lay][v];
          const tx = lay === "SR" ? 1250 : lay === "SL" ? 640 : 960;
          const ty = lay === "W" ? cy : 470;
          const x = Math.min(0, Math.max(1920 * (1 - s), tx - cx * s)), y = Math.min(0, Math.max(1080 * (1 - s), ty - cy * s));
          return { x, y, scale: s, clipPath: "inset(0px 0px 0px 0px round 0px)" };
        }
        {
          const cam = $("cam"), wrap = $("wrap"), ring = $("ring");
          Object.assign(ring.style, { left: PIPBOX.x - 5 + "px", top: PIPBOX.y - 5 + "px", width: PIPBOX.s + 10 + "px", height: PIPBOX.s + 10 + "px" });
          let prev = null, v = 0;
          P.forEach((p, i) => {
            const lay = FR[p.tag];
            if (!lay) throw new Error("no framing for " + p.tag);
            v = prev === lay ? 1 - v : 0;
            const st = place(lay, p.face, v), T = Q(p.out_a);
            const small = (l) => l === "PIP" || l === "OFF";
            const moved = !(prev === null || small(prev) === small(lay));
            if (!moved) {
              tl.set(wrap, st, T);
            } else {
              const T0 = Q(p.out_a - 0.22);
              tl.to(wrap, { ...st, duration: 0.6, ease: "power3.inOut" }, T0);
              if (small(lay)) { tl.set(cam, { zIndex: 4 }, T0); if (lay === "PIP") tl.to(ring, { opacity: 1, duration: 0.25 }, Q(T0 + 0.5)); }
              else { tl.set(ring, { opacity: 0 }, T0); tl.set(cam, { zIndex: 2 }, Q(T0 + 0.6)); }
            }
            if (lay === "OFF" && prev !== "OFF") { tl.to([cam, ring], { opacity: 0, duration: 0.25 }, Q(p.out_a - 0.2)); }
            if (prev === "OFF" && lay !== "OFF") { tl.to(cam, { opacity: 1, duration: 0.25 }, Q(p.out_a - 0.2)); if (small(lay)) tl.to(ring, { opacity: 1, duration: 0.25 }, Q(p.out_a - 0.2)); }
            // slow push-in inside long pieces, so a held shot is never a still
            // (ends 0.25 s before the next cut, so it never overlaps a framing move)
            // (explicit start values, and never on a piece that opens with an animated framing move)
            if (!small(lay) && !moved && p.out_b - p.out_a > 2.2)
              tl.fromTo(wrap, { scale: st.scale, x: st.x, y: st.y }, { scale: st.scale * 1.025, x: st.x - 960 * st.scale * 0.025, y: st.y - 500 * st.scale * 0.025, duration: p.out_b - p.out_a - 0.25, ease: "none", immediateRender: false }, T);
            prev = lay;
          });
          tl.to([cam, ring], { opacity: 0, duration: 0.2 }, Q(D.launch[0] - 0.05));
        }

        const CARDS = $("cards"), TOP = $("top");
        // ================================================ INTRO: a name title as he says hi, then the comments he's answering
        {
          const [a, b] = span("hello");
          const L = el(TOP, "left:0;top:0;width:1920px;height:1080px");
          show(L, 0, b + 0.5);
          const lt = el(L, "left:96px;top:786px;padding:26px 34px 24px 30px;border-radius:22px;background:rgba(255,255,255,.94);box-shadow:0 20px 50px rgba(60,40,20,.16);opacity:0");
          lt.innerHTML = `<div style="display:flex;align-items:center;gap:22px"><div class="bar0" style="width:6px;height:96px;border-radius:3px;background:${C.acc};transform-origin:50% 100%"></div>` +
            `<div><div class="nm serif" style="font-size:66px;line-height:1"><span class="m"><span class="wi">Your</span></span> <span class="m"><span class="wi">Name</span></span></div>` +
            `<div class="sb" style="margin-top:10px;font:600 25px Inter,sans-serif;color:${C.ink2}">Building with Claude Code, every weekend</div></div></div>`;
          const t0 = Math.max(0.25, W(1) + 0.15);
          tl.fromTo(lt, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, Q(t0));
          tl.fromTo(lt.querySelector(".bar0"), { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power3.out" }, Q(t0 + 0.1));
          rise([...lt.querySelectorAll(".wi")], [t0 + 0.15, t0 + 0.25]);
          fade(lt.querySelector(".sb"), t0 + 0.45);
          tl.to(lt, { opacity: 0, x: -20, duration: 0.4, ease: "power2.in" }, Q(t0 + 4.2));
          sfx(S.swish, t0, -22);
          // the comments ("a lot of comments about how you edit")
          [["How do you edit these?", 1330, 150], ["Which editor is this?", 1400, 280], ["Please share the workflow", 1310, 410]].forEach(([q, x, y], k) => {
            const c = el(L, `left:${x}px;top:${y}px;padding:20px 26px 20px 20px;border-radius:22px;background:#fff;box-shadow:0 16px 44px rgba(60,40,20,.15);font:600 28px Inter,sans-serif;color:${C.ink};opacity:0;display:flex;align-items:center;gap:16px`,
              `<span style="width:42px;height:42px;border-radius:50%;background:${["#e9c9b4", "#c9d6c4", "#d6cbe6"][k]};display:inline-block"></span>${q}`);
            enter(c, W(8) + 0.2 * k, { x: 40, y: 0 });
            sfx(S.pop, W(8) + 0.2 * k, -24);
            exit(c, b + 0.1 + k * 0.04);
          });
        }

# Jev questions for cleaning up a take. {placeholders} are filled in by shorts/decide/questions.py.

false_start:
  instructions: >-
    Sentence {sid} of the transcript is: "{sentence}"
    The speaker then says: "{next_sentence}"
    Is sentence {sid} a false start, meaning the speaker abandons it or says it again better straight away,
    so cutting it loses nothing?
  criteria:
    if_true: >-
      The speaker stops mid-thought and restarts, the next sentence repeats the same point more cleanly,
      or the sentence trails off unfinished.
    if_false: >-
      The sentence makes its own point or adds information, even if it is short or casual.

filler_word:
  instructions: >-
    In sentence {sid} the speaker says: "{marked}"
    Is the word in [brackets] ("{word}") a verbal filler that adds no meaning here,
    so the sentence sounds just as natural without it?
  criteria:
    if_true: >-
      It is a hesitation or a speaking habit, such as "like", "basically", "so", "actually" or "matlab",
      and removing it changes nothing.
    if_false: >-
      It carries meaning here, for example a comparison ("looks like"), a real "so" (therefore),
      emphasis the sentence needs, or part of a fixed phrase.

duplicate_take:
  instructions: >-
    The speaker says nearly the same thing more than once ({takes}).
    Which take should stay in the video? The other takes will be cut.
    Prefer the clearest, most complete and most confident one.
  option: 'Take {n}, {sid}: "{sentence}"'

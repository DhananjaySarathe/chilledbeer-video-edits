[project]
name = "video-shorts"
version = "0.1.0"
description = "Claude-driven local editor that turns one vertical talking-head take into a polished short"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.20",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "fonttools>=4.50",
    "python-dotenv>=1.0",
    "typesafe-sdk>=0.7.1",
    "wtpsplit>=2.2.2",
    "praat-parselmouth>=0.4.7",
    "jiwer>=4.0.0",
    "pillow>=12.3.0",
]

[project.scripts]
shorts = "shorts.cli:run"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shorts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs real ffmpeg/whisper/onnx on generated media (seconds)",
    "live: calls the real Jev API (needs TYPESAFE_API_KEY)",
]
addopts = "-m 'not live'"
